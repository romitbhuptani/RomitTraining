<template>
    <div class="forgot-password-container">
        <div class="forgot-password-box">
            <h2>Forgot Password</h2>
            <template if:false={showOtpForm}>
                <!-- Email Form -->
                <form onsubmit={handleSendOtp}>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="slds-input"
                            value={email}
                            onchange={handleInputChange}
                            required
                        />
                    </div>
                    <div class="form-group">
                        <button type="submit" class="slds-button slds-button_brand">Send OTP</button>
                    </div>
                </form>
            </template>
            <template if:true={showOtpForm}>
                <!-- OTP and Password Form -->
                <form onsubmit={handleResetPassword}>
                    <div class="form-group">
                        <label for="otp">OTP</label>
                        <input
                            type="text"
                            id="otp"
                            name="otp"
                            class="slds-input"
                            value={otp}
                            onchange={handleInputChange}
                            required
                        />
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            class="slds-input"
                            value={newPassword}
                            onchange={handleInputChange}
                            required
                        />
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="slds-input"
                            value={confirmPassword}
                            onchange={handleInputChange}
                            required
                        />
                    </div>
                    <div class="form-group">
                        <button type="submit" class="slds-button slds-button_brand">Reset Password</button>
                    </div>
                </form>
            </template>
            <div class="form-group login-link">
                <p>Remembered your password? <button type="button" class="slds-button slds-button_neutral" onclick={handleLoginRedirect}>Log in</button></p>
            </div>
            <template if:true={errorMessage}>
                <div class="slds-text-color_error">{errorMessage}</div>
            </template>
            <template if:true={successMessage}>
                <div class="slds-text-color_success">{successMessage}</div>
            </template>
        </div>
    </div>
</template>
