<template>
    <template if:true={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-labelledby="modal-heading"
            aria-modal="true"
            class="slds-modal slds-fade-in-open welcome-modal"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header welcome-header">
                    <h2 id="modal-heading" class="slds-modal__title">Welcome to the Portal!</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-text-align_center slds-text-body_regular welcome-message">
                        Welcome, {role} {email}!<br />
                        Explore your {role} dashboard to get started.
                    </p>
                    <div class="slds-text-align_center slds-m-top_medium">
                        <lightning-icon icon-name="utility:success" alternative-text="Success" size="large" class="welcome-icon"></lightning-icon>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="brand" label="Close" onclick={closeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
