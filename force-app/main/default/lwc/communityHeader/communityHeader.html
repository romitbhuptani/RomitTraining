<template>
    <template if:false={isExcludedPage}>
        <header class="slds-page-header header-container" role="banner">
            <div class="slds-grid slds-align_absolute-center">
                <!-- Logo and Title -->
                <div class="slds-col slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <img src={logo} alt="Teacher Student Portal Logo" class="logo" aria-label="Community Logo" />
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-text-heading_medium">Teacher Student Portal</h1>
                    </div>
                </div>
                <!-- Navigation -->
                <nav class="slds-col slds-size_1-of-2" role="navigation">
                    <ul class="slds-list_horizontal slds-text-align_right nav-list">
                        <li class="slds-m-horizontal_small">
                            <a href="#" onclick={navigateToHome} class="slds-button slds-button_neutral" aria-label="Go to Home">Home</a>
                        </li>
                        <li class="slds-m-horizontal_small">
                            <a href="#" onclick={navigateToResetPassword} class="slds-button slds-button_neutral" aria-label="Go to Reset Password">Reset Password</a>
                        </li>
                        <li class="slds-m-horizontal_small">
                            <a href="#" onclick={navigateToForgotPassword} class="slds-button slds-button_neutral" aria-label="Go to Forgot Password">Forgot Password</a>
                        </li>
                        <li class="slds-m-horizontal_small">
                            <a href="#" onclick={handleLogout} class="slds-button slds-button_destructive" aria-label="Log Out">Logout</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>
    </template>
</template>
